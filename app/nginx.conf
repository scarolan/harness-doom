server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Note: COOP/COEP not needed — this WASM build uses ASYNCIFY, not pthreads

    location / {
        try_files $uri $uri/ =404;
    }

    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
