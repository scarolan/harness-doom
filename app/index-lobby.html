<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM — Deploy to Prod</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 700px;
            width: 100%;
            padding: 40px 20px;
        }
        h1 {
            font-size: 4em;
            color: #ff4444;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #cc0000, 0 0 80px #990000;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #ff8c00;
            font-size: 1.1em;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section label {
            display: block;
            color: #888;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        #player-name {
            background: #1a1a1a;
            border: 2px solid #ff4444;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1.5em;
            padding: 12px 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        #player-name:focus {
            border-color: #ff6666;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }
        #player-name::placeholder {
            color: #555;
        }
        .difficulty-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .diff-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px 12px;
            width: 120px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .diff-card:hover {
            border-color: #ff4444;
            transform: translateY(-2px);
        }
        .diff-card.selected {
            border-color: #ff4444;
            background: #2a1a1a;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }
        .diff-card .emoji {
            font-size: 2em;
            display: block;
            margin-bottom: 6px;
        }
        .diff-card .name {
            font-size: 0.65em;
            color: #aaa;
            line-height: 1.3;
        }
        .diff-card.selected .name {
            color: #ff8c00;
        }
        .start-btn {
            margin-top: 40px;
            background: #ff4444;
            color: #fff;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 1.4em;
            padding: 16px 50px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.2s;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.4);
        }
        .start-btn:hover {
            background: #ff6666;
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 68, 68, 0.6);
        }
        .start-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .start-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .status-msg {
            margin-top: 20px;
            font-size: 0.85em;
            color: #888;
            min-height: 1.2em;
        }
        .status-msg.error {
            color: #ff4444;
        }
        .pipeline-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #222;
            color: #555;
            font-size: 0.7em;
        }
        .pipeline-info code {
            color: #ff8c00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DOOM</h1>
        <div class="subtitle">Beat E1M1. Deploy to Prod.</div>

        <div class="form-section">
            <label>Enter Your Handle</label>
            <input type="text" id="player-name" placeholder="DOOMGUY" maxlength="30" autocomplete="off" autofocus>
        </div>

        <div class="form-section">
            <label>Choose Your Difficulty</label>
            <div class="difficulty-grid">
                <div class="diff-card" data-diff="1" onclick="selectDifficulty(1)">
                    <span class="emoji">😊</span>
                    <span class="name">I'm Too Young<br>to Die</span>
                </div>
                <div class="diff-card" data-diff="2" onclick="selectDifficulty(2)">
                    <span class="emoji">😏</span>
                    <span class="name">Hey, Not<br>Too Rough</span>
                </div>
                <div class="diff-card selected" data-diff="3" onclick="selectDifficulty(3)">
                    <span class="emoji">😤</span>
                    <span class="name">Hurt Me<br>Plenty</span>
                </div>
                <div class="diff-card" data-diff="4" onclick="selectDifficulty(4)">
                    <span class="emoji">🔥</span>
                    <span class="name">Ultra-<br>Violence</span>
                </div>
                <div class="diff-card" data-diff="5" onclick="selectDifficulty(5)">
                    <span class="emoji">💀</span>
                    <span class="name">Nightmare!</span>
                </div>
            </div>
        </div>

        <button class="start-btn" id="start-btn" onclick="startPipeline()">RIP AND TEAR</button>
        <div class="status-msg" id="status-msg"></div>

        <div class="pipeline-info">
            Triggers a real <code>Harness Pipeline</code> → DOOM approval gate → deploy to prod
        </div>
    </div>

    <script>
        const GATE_SERVER = window.location.origin.replace(/:(\d+)$/, ':30667');
        let selectedDifficulty = 3;

        function selectDifficulty(level) {
            selectedDifficulty = level;
            document.querySelectorAll('.diff-card').forEach(c => c.classList.remove('selected'));
            document.querySelector(`[data-diff="${level}"]`).classList.add('selected');
        }

        function startPipeline() {
            const nameInput = document.getElementById('player-name');
            const player = nameInput.value.trim() || 'DOOMGUY';
            const btn = document.getElementById('start-btn');
            const msg = document.getElementById('status-msg');

            btn.disabled = true;
            btn.textContent = 'STARTING PIPELINE...';
            msg.textContent = 'Triggering Harness pipeline...';
            msg.className = 'status-msg';

            fetch(GATE_SERVER + '/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player: player, difficulty: selectedDifficulty })
            })
            .then(r => r.json())
            .then(data => {
                if (data.started) {
                    msg.textContent = 'Pipeline triggered! Loading DOOM...';
                    setTimeout(() => {
                        window.location.href = `/play.html?player=${encodeURIComponent(player)}&difficulty=${selectedDifficulty}`;
                    }, 800);
                } else {
                    throw new Error('Server did not confirm start');
                }
            })
            .catch(err => {
                msg.textContent = `Error: ${err.message}. Launching anyway...`;
                msg.className = 'status-msg error';
                setTimeout(() => {
                    window.location.href = `/play.html?player=${encodeURIComponent(player)}&difficulty=${selectedDifficulty}`;
                }, 1500);
            });
        }

        document.getElementById('player-name').addEventListener('keydown', e => {
            if (e.key === 'Enter') startPipeline();
        });
    </script>
</body>
</html>
