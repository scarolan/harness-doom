{{- if .Values.harness.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doom-gate.fullname" . }}-harness
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "doom-gate.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.harness.apiKey | b64enc | quote }}
{{- end }}
